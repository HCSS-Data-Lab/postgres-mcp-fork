name: Publish postgres-mcp-fork docker image

on:
  # Trigger the workflow on push
  # but only for the main branch
  push:
    branches:
      - main

jobs:
  push_to_registry:
    name: Push postgres-mcp-fork docker image to GitHub Container Registry
    runs-on: ubuntu-latest

    steps:
      -
        name: Check out the repo
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push postgres-mcp-fork docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/hcss-data-lab/postgres-mcp-fork/postgres-mcp:latest
